services:
  web:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      whishper:
        condition: service_started
    environment:
      SERVER_PORT: 5000
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_MYSQL_HOST: mysql
      AUTH_MYSQL_PORT: 3306
      AUTH_MYSQL_USER: root
      AUTH_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      AUTH_MYSQL_DATABASE: ${MYSQL_DATABASE}
      REQUEST_MYSQL_HOST: mysql
      REQUEST_MYSQL_PORT: 3306
      REQUEST_MYSQL_USER: root
      REQUEST_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REQUEST_MYSQL_DATABASE: ${MYSQL_DATABASE}
      IAP_REDIS_HOST: redis
      IAP_REDIS_PORT: 6379
      IAP_REDIS_DB: 0
      IAP_REDIS_PREFIX: audio_editor
      WHISPER_API_URL: http://whishper:8000
      BACKEND_LOG_LEVEL: INFO
    volumes:
      - ./backend_logs:/app/logs
      - ./backend_uploads:/app/server/uploads

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ./mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./redis_data:/data

  mongo:
    image: mongo
    container_name: whishper-mongo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-whishper}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS:-whishper}
    volumes:
      - ./whishper_data/mongo/db:/data/db
      - ./whishper_data/mongo/logs:/var/log/mongodb
    expose:
      - "27017"
    command: ["--logpath", "/var/log/mongodb/mongod.log"]

  translate:
    image: libretranslate/libretranslate:latest
    container_name: whishper-libretranslate
    restart: unless-stopped
    tty: true
    env_file:
      - .env
    environment:
      LT_DISABLE_WEB_UI: "True"
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,es,fr}
      LT_UPDATE_MODELS: "True"
    volumes:
      - ./whishper_data/libretranslate/data:/home/libretranslate/.local/share
      - ./whishper_data/libretranslate/cache:/home/libretranslate/.local/cache
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 2s
      timeout: 3s
      retries: 5

  whishper:
    image: pluja/whishper:latest
    container_name: whishper
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_started
      translate:
        condition: service_healthy
    expose:
      - "80"
    environment:
      PUBLIC_INTERNAL_API_HOST: http://127.0.0.1:80
      PUBLIC_TRANSLATION_API_HOST: http://translate:5000
      PUBLIC_API_HOST: ${WHISHPER_HOST:-http://whishper}
      PUBLIC_WHISHPER_PROFILE: cpu
      WHISPER_MODELS: ${WHISPER_MODELS:-base}
      WHISPER_MODELS_DIR: /app/models
      UPLOAD_DIR: /app/uploads
      DB_USER: ${DB_USER:-whishper}
      DB_PASS: ${DB_PASS:-whishper}
      CPU_THREADS: ${CPU_THREADS:-4}
    volumes:
      - ./whishper_data/uploads:/app/uploads
      - ./whishper_data/models:/app/models
      - ./whishper_data/logs:/var/log/whishper

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - web
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
