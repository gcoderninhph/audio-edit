services:
  web:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      whishper:
        condition: service_started
    environment:
      SERVER_PORT: 5000
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_MYSQL_HOST: mysql
      AUTH_MYSQL_PORT: 3306
      AUTH_MYSQL_USER: root
      AUTH_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      AUTH_MYSQL_DATABASE: ${MYSQL_DATABASE}
      REQUEST_MYSQL_HOST: mysql
      REQUEST_MYSQL_PORT: 3306
      REQUEST_MYSQL_USER: root
      REQUEST_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REQUEST_MYSQL_DATABASE: ${MYSQL_DATABASE}
      IAP_REDIS_HOST: redis
      IAP_REDIS_PORT: 6379
      IAP_REDIS_DB: 0
      IAP_REDIS_PREFIX: audio_editor
      WHISPER_API_URL: http://whishper:8000
      BACKEND_LOG_LEVEL: INFO
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      CLOUDFLARE_R2_BUCKET_NAME: ${CLOUDFLARE_R2_BUCKET_NAME}
      CLOUDFLARE_R2_REGION: ${CLOUDFLARE_R2_REGION}
      CLOUDFLARE_R2_DOMAIN: ${CLOUDFLARE_R2_DOMAIN}
      CLOUDFLARE_R2_TOKEN_VALUE: ${CLOUDFLARE_R2_TOKEN_VALUE}
    volumes:
      - ./backend_logs:/app/logs
      - ./backend_uploads:/app/server/uploads

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ./mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./redis_data:/data

  mongo:
    image: mongo
    container_name: whishper-mongo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-whishper}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS:-whishper}
    volumes:
      - ./whishper_data/mongo/db:/data/db
      - ./whishper_data/mongo/logs:/var/log/mongodb
    expose:
      - "27017"
    command: [ "--logpath", "/var/log/mongodb/mongod.log" ]

  translate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    expose:
      - "5000"

  whishper:
    image: pluja/whishper:latest
    container_name: whishper
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_started
      translate:
        condition: service_started
    expose:
      - "80"
    ports:
      - "8000:80"
    environment:
      PUBLIC_INTERNAL_API_HOST: http://127.0.0.1:80
      PUBLIC_TRANSLATION_API_HOST: ""
      PUBLIC_API_HOST: ${WHISHPER_HOST:-http://whishper}
      PUBLIC_WHISHPER_PROFILE: cpu
      WHISPER_MODELS: ${WHISPER_MODELS:-base}
      WHISPER_MODELS_DIR: /app/models
      UPLOAD_DIR: /app/uploads
      DB_USER: ${DB_USER:-whishper}
      DB_PASS: ${DB_PASS:-whishper}
      CPU_THREADS: ${CPU_THREADS:-4}
    volumes:
      - ./whishper_data/uploads:/app/uploads
      - ./whishper_data/models:/app/models
      - ./whishper_data/logs:/var/log/whishper

  whishper-2:
    image: pluja/whishper:latest
    container_name: whishper-2
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_started
      translate:
        condition: service_started
    expose:
      - "80"
    ports:
      - "8001:80"
    environment:
      PUBLIC_INTERNAL_API_HOST: http://127.0.0.1:80
      PUBLIC_TRANSLATION_API_HOST: ""
      PUBLIC_API_HOST: ${WHISHPER_NODE_2_HOST:-http://whishper-2}
      PUBLIC_WHISHPER_PROFILE: cpu
      WHISPER_MODELS: ${WHISPER_MODELS:-base}
      WHISPER_MODELS_DIR: /app/models
      UPLOAD_DIR: /app/uploads
      DB_USER: ${DB_USER:-whishper}
      DB_PASS: ${DB_PASS:-whishper}
      CPU_THREADS: ${CPU_THREADS:-4}
    volumes:
      - ./whishper_data/uploads-node-2:/app/uploads
      - ./whishper_data/models:/app/models
      - ./whishper_data/logs-node-2:/var/log/whishper

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - web
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
