services:
  web:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      llm-subtrans-web:
        condition: service_healthy
      whishper:
        condition: service_started
    environment:
      SERVER_PORT: 5000
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_MYSQL_HOST: mysql
      AUTH_MYSQL_PORT: 3306
      AUTH_MYSQL_USER: root
      AUTH_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      AUTH_MYSQL_DATABASE: ${MYSQL_DATABASE}
      REQUEST_MYSQL_HOST: mysql
      REQUEST_MYSQL_PORT: 3306
      REQUEST_MYSQL_USER: root
      REQUEST_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REQUEST_MYSQL_DATABASE: ${MYSQL_DATABASE}
      IAP_REDIS_HOST: redis
      IAP_REDIS_PORT: 6379
      IAP_REDIS_DB: 0
      IAP_REDIS_PREFIX: audio_editor
      LLM_SUBTRANS_API_URL: http://llm-subtrans-web:8080/api
      WHISPER_API_URL: http://whishper:8000
      BACKEND_LOG_LEVEL: INFO
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      CLOUDFLARE_R2_BUCKET_NAME: ${CLOUDFLARE_R2_BUCKET_NAME}
      CLOUDFLARE_R2_REGION: ${CLOUDFLARE_R2_REGION}
      CLOUDFLARE_R2_DOMAIN: ${CLOUDFLARE_R2_DOMAIN}
      CLOUDFLARE_R2_TOKEN_VALUE: ${CLOUDFLARE_R2_TOKEN_VALUE}
    volumes:
      - ./backend_logs:/app/logs
      - ./backend_uploads:/app/server/uploads

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ./mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./redis_data:/data

  subtrans-redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - ./subtrans_redis_data:/data

  llm-subtrans-web:
    image: ninhmphpl/llm_subtrans:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
    environment:
      REDIS_URL: redis://host.docker.internal:6380/0
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${LLM_SUBTRANS_PORT:-8091}:8080"
    volumes:
      - ./llm_subtrans_data:/workspace/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: [ "web" ]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()
      interval: 20s
      timeout: 5s
      retries: 5

  llm-subtrans:
    image: ninhmphpl/llm_subtrans:latest
    profiles:
      - cli
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
    environment:
      REDIS_URL: redis://host.docker.internal:6380/0
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ./llm_subtrans_data:/workspace/data
    command: [ "cli" ]
    restart: "no"

  mongo:
    image: mongo
    container_name: whishper-mongo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-whishper}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS:-whishper}
    volumes:
      - ./whishper_data/mongo/db:/data/db
      - ./whishper_data/mongo/logs:/var/log/mongodb
    expose:
      - "27017"
    command: [ "--logpath", "/var/log/mongodb/mongod.log" ]

  whishper:
    image: pluja/whishper:latest
    container_name: whishper
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_started
    expose:
      - "80"
    ports:
      - "8000:80"
    environment:
      PUBLIC_INTERNAL_API_HOST: http://127.0.0.1:80
      PUBLIC_TRANSLATION_API_HOST: ""
      PUBLIC_API_HOST: ${WHISHPER_HOST:-http://whishper}
      PUBLIC_WHISHPER_PROFILE: cpu
      WHISPER_MODELS: ${WHISPER_MODELS:-base}
      WHISPER_MODELS_DIR: /app/models
      UPLOAD_DIR: /app/uploads
      DB_USER: ${DB_USER:-whishper}
      DB_PASS: ${DB_PASS:-whishper}
      CPU_THREADS: ${CPU_THREADS:-4}
    volumes:
      - ./whishper_data/uploads:/app/uploads
      - ./whishper_data/models:/app/models
      - ./whishper_data/logs:/var/log/whishper

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - web
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
